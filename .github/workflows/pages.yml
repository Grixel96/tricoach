name: Deploy PWA to Pages

# Veröffentlicht den app/-Ordner (PWA + data.json + plan.ics) auf GitHub Pages.
# Läuft bei jedem Push auf main (also auch nach dem täglichen Health-Update).

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deploy gleichzeitig; laufende nicht abbrechen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Upload app/ als Pages-Artefakt
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./app

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
