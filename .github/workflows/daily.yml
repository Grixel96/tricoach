name: TriCoach Daily Update

# Autonomer Morgen-Job: zieht Garmin-Health, passt heutige Einheit an Tagesform an,
# schreibt app/data.json + app/plan.ics, committet UND deployt direkt auf Pages.
# Läuft auch wenn der PC aus ist.

on:
  schedule:
    - cron: "40 4 * * *"   # täglich 04:40 UTC (~06:40 Sommerzeit) — Morgen-Check
    - cron: "0 17 * * 0"   # So 17:00 UTC (~19:00) — Wochen-Refresh des Kalenders
  workflow_dispatch:        # manuell auslösbar

permissions:
  contents: write
  pages: write
  id-token: write

# Nur ein Pages-Deploy gleichzeitig.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Daily update
        env:
          GARMINTOKENS: ${{ secrets.GARMINTOKENS }}
        run: python tools/daily_update.py

      # Wöchentliches KI-Review (nur So-Cron oder manuell). Ohne ANTHROPIC_API_KEY
      # läuft es regelbasiert weiter (kein harter Fehler).
      - name: Weekly KI-Review
        if: github.event.schedule == '0 17 * * 0' || github.event_name == 'workflow_dispatch'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python tools/weekly_review.py

      - name: Commit changes
        run: |
          git config user.name "TriCoach Bot"
          git config user.email "tricoach-bot@users.noreply.github.com"
          git add app/data.json app/plan.ics app/history.json app/plan.json app/review.json
          if git diff --staged --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "chore: tägliches Health-Update $(date -u +%F)"
            git push
          fi

      # Live-App nach dem Update direkt neu veröffentlichen (Bot-Push triggert
      # keinen separaten Workflow, darum hier im selben Job deployen).
      - uses: actions/configure-pages@v5

      - name: Upload app/ als Pages-Artefakt
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./app

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
