name: TriCoach History Backfill

# Manuell ausführbarer Job: füllt app/history.json einmalig mit echter
# Garmin-Vergangenheit (Aktivitäten + Health) auf, damit Analyse-Charts und
# CTL/ATL/TSB sofort sinnvoll sind. Nutzt denselben GARMINTOKENS-Secret wie der
# tägliche Job. Committet history.json zurück nach main.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Wie viele Tage zurück auffüllen"
        required: false
        default: "120"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Backfill history
        env:
          GARMINTOKENS: ${{ secrets.GARMINTOKENS }}
        run: python tools/backfill_history.py --days ${{ github.event.inputs.days }}

      - name: Commit history.json
        run: |
          git config user.name "TriCoach Bot"
          git config user.email "tricoach-bot@users.noreply.github.com"
          git add app/history.json
          if git diff --staged --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "data: history.json mit Garmin-Vergangenheit aufgefüllt"
            git push
          fi
